# IFT3913 tâche 2 : exécute les tests de tika-core (originaux, générés par ChatUniTest
# et écrits à la main) puis l'analyse de mutation sur les deux classes étudiées.
name: tache2 tika-core tests et mutation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests-et-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build tika-core et ses dépendances
        run: mvn -B install -pl tika-core -am -DskipTests
      - name: Tests de tika-core (avec checkstyle, forbiddenapis, RAT)
        run: mvn -B test -pl tika-core
      - name: Analyse de mutation (EndianUtils, FilenameUtils)
        run: >
          mvn -B org.pitest:pitest-maven:mutationCoverage -pl tika-core
          -DtargetClasses=org.apache.tika.io.EndianUtils,org.apache.tika.io.FilenameUtils
      - name: Rapport pitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-pitest
          path: tika-core/target/pit-reports
