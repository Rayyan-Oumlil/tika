# IFT3913 tâche 3 : exécute les tests de tika-core et rickroll si l'un d'eux échoue.
name: tache3 tests et rickroll

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build tika-core et ses dépendances
        run: mvn -B install -pl tika-core -am -DskipTests
      - name: Tests de tika-core
        run: mvn -B test -pl tika-core
      - name: Rickroll (seulement si un test a échoué)
        if: failure()
        uses: ./.github/actions/rickroll
        with:
          message: Un test de tika-core a échoué.
